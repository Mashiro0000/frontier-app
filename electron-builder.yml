appId: com.frontier.app
productName: Frontier App
directories:
  buildResources: build
  output: dist
# 18.1 (D-050): an allow-list, not a deny-list. The package holds the built app (out/) and package.json;
# electron-builder adds the production dependencies from node_modules itself. Nothing else of the repo
# (src/, tools/, docs/, registry/, the owner's files) can slip in. tools/verify-18-1.mjs checks the result.
files:
  - out/**/*
  - package.json
# Windows only (Stage 18): macOS and Linux builds have never been tested.
win:
  executableName: frontier-app
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  # Per user, no admin: installed under %LOCALAPPDATA%\Programs.
  perMachine: false
  # The uninstaller removes the program only; the data folder (%APPDATA%\frontier-app) stays.
  deleteAppDataOnUninstall: false
# The installed program cannot be turned into something else (18.1, D-050): no running as plain Node
# (ELECTRON_RUN_AS_NODE), no NODE_OPTIONS, no --inspect debugger, and the app is loaded only from its
# app.asar, whose hash the program checks. Development (npm run dev / start) uses the plain Electron.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
npmRebuild: false
# Nothing is published by the builder: releases are signed by tools/release.mjs and uploaded by hand (18.7).
publish: null
